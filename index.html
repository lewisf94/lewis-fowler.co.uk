<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lewis Fowler · Design Engineer</title>
    <meta name="description" content="Lewis Fowler is a design engineer in Newcastle upon Tyne. He designs products from concept to tested prototype, and builds electronics, robots and software in his own time." />
    <meta name="author" content="Lewis Fowler" />
    <meta name="theme-color" content="#0b0b0a" />
    <link rel="canonical" href="https://lewis-fowler.co.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lewis-fowler.co.uk/" />
    <meta property="og:site_name" content="Lewis Fowler" />
    <meta property="og:title" content="Lewis Fowler · Design Engineer" />
    <meta property="og:description" content="Embedded hardware, motor control and robotics projects by a design engineer in Newcastle upon Tyne." />
    <meta property="og:image" content="https://lewis-fowler.co.uk/assets/social/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lewis Fowler",
        "jobTitle": "Mechanical Design Engineer",
        "url": "https://lewis-fowler.co.uk/",
        "address": { "@type": "PostalAddress", "addressLocality": "Newcastle upon Tyne", "addressCountry": "GB" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Glasgow" }
      }
    </script>
    <script>
      // Apply the saved theme before the first paint, so the page does not flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
